[package]
name = "orkoswap-grin-wallet"
version = "0.1.2"
edition = "2021"
description = "Orkoswap Grin Wallet"
publish = false
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
orko-grin-core = { path = "../../core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
log = "0.4"
grin_util = "5.5.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
