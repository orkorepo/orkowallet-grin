[package]
name = "orko-grin-core"
version = "0.2.0"
edition = "2021"
description = "Orkoswap Grin wallet core: wraps the official grin-wallet libraries"
publish = false
license = "Apache-2.0"

[dependencies]
grin_wallet_libwallet = "5.5.1"
grin_wallet_impls = "5.5.1"
grin_wallet_api = "5.5.1"
grin_wallet_config = "5.5.1"
grin_wallet_util = "5.5.1"
grin_keychain = "5.5.2"
grin_core = "5.5.2"
grin_util = "5.5.2"
anyhow = "1"
grin_wallet_controller = "5.5.1"
log = "0.4.35"
uuid = "1.29.2"
serde_json = "1.0.154"
grin_servers = "5.5.2"
grin_chain = "5.5.2"
grin_p2p = "5.5.2"
grin_api = "5.5.2"
grin_config = "5.5.2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
