name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check translations
        run: |
          node scripts/check-i18n.js

      - name: Fetch Tor bundle (SHA-256 + signature verified)
        shell: pwsh
        run: ./scripts/fetch-tor.ps1

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build

      - name: SHA-256
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Tee-Object -FilePath SHA256SUMS.txt

      # Code signing: after SignPath Foundation approves the project, add a step here that uploads the
      # unsigned installer artifact to SignPath and downloads the signed one (signpath/github-action-submit-signing-request).

      - uses: actions/upload-artifact@v4
        with:
          name: OrkoWallet-Grin-installer
          path: |
            target/release/bundle/nsis/*.exe
            SHA256SUMS.txt

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "OrkoWallet - Grin $env:GITHUB_REF_NAME" --generate-notes }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem target/release/bundle/nsis/*.exe) SHA256SUMS.txt --clobber
