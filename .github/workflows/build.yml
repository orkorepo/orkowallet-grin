name: Build desktop apps (Windows, Linux, macOS)

# Free GitHub runners build every desktop version from the same code. A tag v* also attaches the files to
# the GitHub release. "Run workflow" (workflow_dispatch) only builds; the files are under the run's artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check translations
        run: node scripts/check-i18n.js

      - name: Fetch Tor bundle (SHA-256 + signature verified)
        shell: pwsh
        run: ./scripts/fetch-tor.ps1 -Platform windows-x86_64

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis

      # Code signing: after SignPath Foundation approves the project, add a step here that uploads the
      # unsigned installer artifact to SignPath and downloads the signed one (signpath/github-action-submit-signing-request).

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe

  linux:
    # The oldest supported Ubuntu runner: the AppImage and .deb then run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: System libraries (WebKitGTK, tray, build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config clang libclang-dev build-essential patchelf file libfuse2

      - name: Fetch Tor bundle (signed hash list + signature verified)
        shell: pwsh
        run: ./scripts/fetch-tor.ps1 -Platform linux-x86_64

      - name: Build .deb and AppImage
        working-directory: app
        env:
          # linuxdeploy strips every library it packs; Ubuntu 22.04's strip cannot read the newer Tor bundle
          # libraries and the AppImage step fails. Linuxdeploy itself is an AppImage: run it without FUSE.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # tor's own libraries (libevent, OpenSSL) sit next to it; linuxdeploy must find them there.
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/tor-16.0.1/tor
        run: |
          npm ci
          npx tauri build --bundles deb,appimage --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest  # Apple Silicon
            tor: macos-aarch64
            name: macos-apple-silicon
          - runner: macos-15-intel # Intel (the last Intel runner GitHub offers)
            tor: macos-x86_64
            name: macos-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: gpg (for the Tor signature check)
        run: command -v gpg || brew install gnupg

      - name: Fetch Tor bundle (signed hash list + signature verified)
        shell: pwsh
        run: ./scripts/fetch-tor.ps1 -Platform ${{ matrix.tor }}

      # Not signed with an Apple Developer ID: the project has no income and stays free of paid accounts.
      # The release notes explain how to open it (right click > Open the first time).
      - name: Build .app and .dmg
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/bundle/dmg/*.dmg

  release:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256 of every file
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS.txt

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes="docs/release-notes/${tag}.md"
            if [ -f "$notes" ]; then gh release create "$tag" --title "OrkoWallet – Grin ${tag}" --notes-file "$notes"
            else gh release create "$tag" --title "OrkoWallet – Grin ${tag}" --generate-notes; fi
          fi
          gh release upload "$tag" dist/* --clobber
