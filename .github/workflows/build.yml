name: Build desktop apps (Windows, Linux, macOS)

# Free GitHub runners build every desktop version from the same code. A tag v* also publishes the files on
# the GitHub release, with a download list (names, sizes, links) and SHA256SUMS.txt. "Run workflow"
# (workflow_dispatch) only builds; the files are then under the run's artifacts.
#
# File names: OrkoWallet-<version>-<system>-<arch>.<ext>

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check translations
        run: node scripts/check-i18n.js

      - name: Fetch Tor bundle (SHA-256 + signature verified)
        shell: pwsh
        run: ./scripts/fetch-tor.ps1 -Platform windows-x86_64

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis

      # Code signing: after SignPath Foundation approves the project, add a step here that uploads the
      # unsigned installer artifact to SignPath and downloads the signed one (signpath/github-action-submit-signing-request).

      - name: Name the files
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out, portable/tor | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1) "out/OrkoWallet-$v-windows-x64-setup.exe"
          # Portable: the program with its Tor folder next to it, no installation.
          Copy-Item target/release/orkoswap-grin-wallet.exe "portable/OrkoWallet.exe"
          Copy-Item -Recurse vendor/tor-16.0.1/* portable/tor/
          Compress-Archive -Path portable/* -DestinationPath "out/OrkoWallet-$v-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    # The oldest supported Ubuntu runner: the packages then run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: System libraries (WebKitGTK, tray, build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config clang libclang-dev build-essential patchelf file libfuse2

      - name: Fetch Tor bundle (signed hash list + signature verified)
        shell: pwsh
        run: ./scripts/fetch-tor.ps1 -Platform linux-x86_64

      - name: Build .deb, .rpm and AppImage
        working-directory: app
        env:
          # linuxdeploy strips every library it packs; Ubuntu 22.04's strip cannot read the newer Tor bundle
          # libraries and the AppImage step fails. Linuxdeploy itself is an AppImage: run it without FUSE.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # tor's own libraries (libevent, OpenSSL) sit next to it; linuxdeploy must find them there.
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/tor-16.0.1/tor
        run: |
          npm ci
          npx tauri build --bundles deb,rpm,appimage --verbose

      - name: Name the files
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          mkdir -p out portable/orkowallet/tor
          cp target/release/bundle/deb/*.deb "out/OrkoWallet-$v-linux-amd64.deb"
          cp target/release/bundle/rpm/*.rpm "out/OrkoWallet-$v-linux-x86_64.rpm"
          cp target/release/bundle/appimage/*.AppImage "out/OrkoWallet-$v-linux-x86_64.AppImage"
          # Portable: the program with its Tor folder next to it.
          cp target/release/orkoswap-grin-wallet portable/orkowallet/orkowallet
          cp -r vendor/tor-16.0.1/* portable/orkowallet/tor/
          tar -czf "out/OrkoWallet-$v-linux-x86_64.tar.gz" -C portable orkowallet

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest     # Apple Silicon
            tor: macos-aarch64
            arch: arm64
          - runner: macos-15-intel   # Intel (the last Intel runner GitHub offers)
            tor: macos-x86_64
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: gpg (for the Tor signature check)
        run: command -v gpg || brew install gnupg

      - name: Fetch Tor bundle (signed hash list + signature verified)
        shell: pwsh
        run: ./scripts/fetch-tor.ps1 -Platform ${{ matrix.tor }}

      # Not signed with an Apple Developer ID: the project has no income and stays free of paid accounts.
      # The release notes explain how to open it (right click > Open the first time).
      - name: Build .app and .dmg
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles app,dmg

      - name: Name the files
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp target/release/bundle/dmg/*.dmg "out/OrkoWallet-$v-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/*

  release:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Source archive
        run: |
          v="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="OrkoWallet-$v/" -o "dist/OrkoWallet-$v-source.zip" HEAD

      - name: SHA-256 of every file
        run: |
          cd dist
          sha256sum OrkoWallet-* | tee SHA256SUMS.txt

      - name: Release notes with the download list
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          notes="docs/release-notes/${tag}.md"
          { [ -f "$notes" ] && cat "$notes" || echo "# OrkoWallet – Grin ${tag}"
            echo
            echo "## 📦 Download"
            echo
            for f in dist/*; do
              n=$(basename "$f")
              size=$(numfmt --to=si --suffix=B --format='%.1f' "$(stat -c %s "$f")")
              echo "- **[${n}](https://github.com/${repo}/releases/download/${tag}/${n})** (${size})"
            done
            echo
            echo "Android: \`OrkoWallet-${tag#v}-android-arm64.apk\` is signed with the project key on a maintainer's machine and added to this release separately."
          } > release-notes.md
          cat release-notes.md

      - name: Publish on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then gh release edit "$tag" --notes-file release-notes.md
          else gh release create "$tag" --title "OrkoWallet – Grin ${tag}" --notes-file release-notes.md; fi
          gh release upload "$tag" dist/* --clobber
